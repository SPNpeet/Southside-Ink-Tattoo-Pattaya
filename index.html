    <!-- FAQ schema — คำถามตรงกับหน้าเว็บทุกข้อ ข้อความใหม่ต้องแก้ทั้งสองที่ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "ไม่มีความรู้ด้านเทคนิคเลย คุยกันรู้เรื่องไหม",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "รู้เรื่องแน่นอน คุณเล่าว่าติดอะไรอยู่ก็พอ ศัพท์เทคนิคเป็นหน้าที่เราที่ต้องแปลให้เข้าใจ"
            }
          },
          {
            "@type": "Question",
            "name": "อยากทำแค่บางส่วน ไม่เอาทั้งหมด ได้ไหม",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ได้ครับ แนะนำให้เริ่มจากจุดที่เจ็บที่สุดก่อน พอเห็นผลแล้วค่อยขยายทีหลัง"
            }
          },
          {
            "@type": "Question",
            "name": "ราคาประมาณเท่าไหร่",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ขึ้นกับขอบเขตงาน เราจะสรุปขอบเขตและราคามาให้ดูก่อนเริ่มเสมอ ช่วงคุยและประเมินไม่มีค่าใช้จ่าย"
            }
          },
          {
            "@type": "Question",
            "name": "อยู่ต่างจังหวัด ทำงานด้วยกันได้ไหม",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ได้ครับ เรารับงานทั่วประเทศและทำงานออนไลน์เต็มรูปแบบอยู่แล้ว"
            }
          },
          {
            "@type": "Question",
            "name": "ทำเสร็จแล้วใช้ไม่เป็น จะทำยังไง",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "เราสอนทีมคุณจนใช้เป็นก่อนถึงจะถือว่าจบงาน และมีคู่มือให้ดูย้อนหลัง"
            }
          },
          {
            "@type": "Question",
            "name": "เริ่มต้นต้องทำอะไรบ้าง",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ทักมาเล่าให้ฟังอย่างเดียวเลย ไม่ต้องเตรียมเอกสารหรือข้อมูลอะไรมาก่อน เราตอบกลับภายใน 24 ชั่วโมง"
            }
          },
          {
            "@type": "Question",
            "name": "มีงานเร่งด่วนมาก ต้องเสร็จไวจริง ๆ ได้ไหม",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ทักมาเลย แล้วบอกว่าดีไลน์ต้องเมื่อไหร่ เราจะบอกตรง ๆ ว่าทำทันหรือไม่ทัน และมีทางไหนช่วยได้บ้าง"
            }
          },
          {
            "@type": "Question",
            "name": "แค่อยากปรึกษาก่อนเฉย ๆ ยังไม่ตัดสินใจจ้าง ได้ไหม",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ได้เลยครับ ปรึกษาครั้งแรกไม่มีค่าใช้จ่าย และไม่มีการตื๊อขาย — ยังไม่พร้อมก็บอกได้ ไม่ได้เป็นไร"
            }
          },

            "@type": "Question",
            "name": "ทำไมต้องจ้างคุณ ทำเองไม่ได้เหรอ",

            }
          }
        ]

  <body>
    <script>
      // ใส่ธีมก่อนหน้าจอวาด กันไฟกระพริบขาววาบตอนโหลดในโหมดมืด
      try {
        var t = localStorage.getItem('sc-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}

      // เปิดโหมดค่อย ๆ เผยเนื้อหา ต้องใส่ก่อนวาดเช่นกัน
      // ถ้าใส่ทีหลัง เนื้อหาจะโผล่มาแล้วค่อยจางหาย เห็นเป็นภาพกระพริบ
      // เปิดเฉพาะเครื่องที่รองรับจริงและผู้ใช้ไม่ได้ขอลดการเคลื่อนไหว
      // ถ้าสคริปต์หลักไม่ทำงาน hooks.js จะถอดคลาสนี้คืนให้เนื้อหาแสดงครบ
      try {
        if (
          'IntersectionObserver' in window &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('js-reveal')
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
