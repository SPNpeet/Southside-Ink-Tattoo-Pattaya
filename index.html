<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sudo-command/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/sudo-command/favicon.ico" />
    <link rel="apple-touch-icon" href="/sudo-command/apple-touch-icon.png" />
    <link rel="canonical" href="https://spnpeet.github.io/sudo-command/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sudo Command — รับวางระบบบัญชีอัตโนมัติ AI ผู้ช่วยตอบลูกค้า และ Web App สำหรับ SME และสำนักงานบัญชี พร้อมงานกราฟิกและงาน 3D ครบในทีมเดียว"
    />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <title>Sudo Command — ระบบบัญชีอัตโนมัติ AI และ Web App สำหรับธุรกิจ</title>

    <!-- ฟอนต์ที่ CSS เรียกใช้ ต้องโหลดจริง ไม่งั้นเครื่องลูกค้าจะ fallback เป็นฟอนต์ระบบ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- แชร์ลิงก์ลงเฟซบุ๊ก/ไลน์ ให้ขึ้นรูปและชื่อ -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="Sudo Command" />
    <meta property="og:url" content="https://spnpeet.github.io/sudo-command/" />
    <meta
      property="og:title"
      content="Sudo Command — ระบบบัญชีอัตโนมัติ AI และ Web App สำหรับธุรกิจ"
    />
    <meta
      property="og:description"
      content="รับวางระบบบัญชีที่ไม่ต้องคีย์มือ AI ผู้ช่วยตอบลูกค้าบน LINE และ Facebook และ Web App สำหรับ SME และสำนักงานบัญชี พร้อมงานกราฟิกและ 3D ครบในทีมเดียว"
    />
    <meta property="og:image" content="https://spnpeet.github.io/sudo-command/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // ใส่ธีมก่อนหน้าจอวาด กันไฟกระพริบขาววาบตอนโหลดในโหมดมืด
      try {
        var t = localStorage.getItem('sc-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}

      // เปิดโหมดค่อย ๆ เผยเนื้อหา ต้องใส่ก่อนวาดเช่นกัน
      // ถ้าใส่ทีหลัง เนื้อหาจะโผล่มาแล้วค่อยจางหาย เห็นเป็นภาพกระพริบ
      // เปิดเฉพาะเครื่องที่รองรับจริงและผู้ใช้ไม่ได้ขอลดการเคลื่อนไหว
      // ถ้าสคริปต์หลักไม่ทำงาน hooks.js จะถอดคลาสนี้คืนให้เนื้อหาแสดงครบ
      try {
        if (
          'IntersectionObserver' in window &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('js-reveal')
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
