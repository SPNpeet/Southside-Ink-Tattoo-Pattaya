    <!-- ฟอนต์ที่ CSS เรียกใช้ ต้องโหลดจริง ไม่งั้นเครื่องลูกค้าจะ fallback เป็นฟอนต์ระบบ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- แชร์ลิงก์ลงเฟซบุ๊ก/ไลน์ ให้ขึ้นรูปและชื่อ -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="Sudo Command" />
    <meta property="og:url" content="https://spnpeet.github.io/sudo-command/" />
    <meta
      property="og:title"
      content="Sudo Command — ระบบบัญชีอัตโนมัติ AI และ Web App สำหรับธุรกิจ"
    />

      property="og:description"
      content="รับวางระบบบัญชีที่ไม่ต้องคีย์มือ AI ผู้ช่วยตอบลูกค้าบน LINE และ Facebook และ Web App สำหรับ SME และสำนักงานบัญชี พร้อมงานกราฟิกและ 3D ครบในทีมเดียว"

    <meta name="twitter:card" content="summary_large_image" />

    <!-- ข้อมูลโครงสร้างสำหรับ Google
         ใส่เฉพาะข้อมูลที่มีอยู่จริงเท่านั้น ยังไม่ใส่ telephone เพราะเบอร์ยังไม่ยืนยัน
         ข้อมูลปลอมใน schema ทำให้โดนตัดสิทธิ์แสดงผลพิเศษ และเสียความน่าเชื่อถือ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Sudo Command",
        "alternateName": "Sudo Command Tech & Creative Agency",
        "url": "https://spnpeet.github.io/sudo-command/",
        "image": "https://spnpeet.github.io/sudo-command/og.png",
        "description": "รับวางระบบบัญชีอัตโนมัติ AI ผู้ช่วยตอบลูกค้า และ Web App สำหรับ SME และสำนักงานบัญชี พร้อมงานกราฟิกและงาน 3D",
        "email": "sudocoffee.home@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "บางมด",
          "addressRegion": "กรุงเทพมหานคร",
          "postalCode": "10140",
          "addressCountry": "TH"
        },
        "areaServed": {
          "@type": "Country",
          "name": "ประเทศไทย"
        },
        "availableLanguage": {
          "@type": "Language",
          "name": "Thai"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "sudocoffee.home@gmail.com",
          "areaServed": "TH",
          "availableLanguage": ["th"]
        },
        "sameAs": ["https://www.facebook.com/profile.php?id=61590190966678"],
        "knowsAbout": [
          "ระบบบัญชีอัตโนมัติ",
          "AI Chatbot",
          "Web Application",
          "เว็บไซต์ธุรกิจ",
          "กราฟิกดีไซน์",
          "โมเดล 3 มิติ"
        ]
      }
    </script>
  </head>
  <body>
    <script>
      // ใส่ธีมก่อนหน้าจอวาด กันไฟกระพริบขาววาบตอนโหลดในโหมดมืด
      try {
        var t = localStorage.getItem('sc-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}

      // เปิดโหมดค่อย ๆ เผยเนื้อหา ต้องใส่ก่อนวาดเช่นกัน
      // ถ้าใส่ทีหลัง เนื้อหาจะโผล่มาแล้วค่อยจางหาย เห็นเป็นภาพกระพริบ
      // เปิดเฉพาะเครื่องที่รองรับจริงและผู้ใช้ไม่ได้ขอลดการเคลื่อนไหว
      // ถ้าสคริปต์หลักไม่ทำงาน hooks.js จะถอดคลาสนี้คืนให้เนื้อหาแสดงครบ
      try {
        if (
          'IntersectionObserver' in window &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('js-reveal')
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
